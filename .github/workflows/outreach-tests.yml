name: Outreach safety gate tests
on:
  pull_request:
    paths: ['outreach/**', '.github/workflows/outreach-tests.yml']
  push:
    paths: ['outreach/**', '.github/workflows/outreach-tests.yml']
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests (no sending)
        run: python -m unittest discover -s outreach -p 'test_*.py' -v
