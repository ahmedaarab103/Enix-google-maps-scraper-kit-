name: ENIX Cloud Outreach (safe by default)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discovery or send"
        required: true
        type: choice
        options: [discovery, send]
  schedule:
    - cron: "17 9 * * 1-5"
permissions:
  contents: read
concurrency:
  group: enix-cloud-outreach
  cancel-in-progress: false
jobs:
  send:
    if: github.event_name == 'schedule' || inputs.mode == 'send'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ENIX_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.ENIX_GOOGLE_SHEET_ID }}
      SMTP_HOST: ${{ secrets.ENIX_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.ENIX_SMTP_PORT }}
      SMTP_USER: ${{ secrets.ENIX_SMTP_USER }}
      SMTP_PASS: ${{ secrets.ENIX_SMTP_PASS }}
      IMAP_HOST: ${{ secrets.ENIX_IMAP_HOST }}
      ENIX_SEND_ENABLED: ${{ vars.ENIX_SEND_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cloud/requirements.txt
      - name: Review replies and process approved queue
        run: python cloud/outreach.py
  discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start original scraper locally on runner
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/v1/jobs && break || sleep 3; done
      - name: Run a small discovery job (opt-in; review Google terms)
        run: |
          python scripts/scrape.py "${{ vars.ENIX_DISCOVERY_QUERY || 'hotels in Marrakech' }}" --city "${{ vars.ENIX_DISCOVERY_CITY || 'Marrakech Morocco' }}" --depth 3
      - name: Export temporary results (do not put personal leads in public GitHub artifacts)
        run: |
          echo "Scraping finished. Connect an approved private data sink before keeping or distributing contact exports."
